name: Android release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Pojarush/**"
      - "horizon/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libssl-dev

      - name: Build Horizon Android native libraries
        run: |
          chmod +x ./horizon/android/build-android.sh
          ./horizon/android/build-android.sh

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :Pojarush:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pojarush-Horizon-Android-APK
          path: Pojarush/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
